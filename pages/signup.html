<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — TryOnix</title>
  <meta name="description" content="Create your TryOnix account to save outfits, manage your avatar, and get personalized recommendations." />
  <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  <link rel="stylesheet" href="/css/animations.css" />
</head>
<body>
  <div class="bg-mesh"></div>
  <div class="toast-container" id="toastContainer"></div>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="nav-logo" style="display:inline-block; margin-bottom: var(--space-lg);">TryOnix</a>
        <h2>Create Account</h2>
        <p>Join TryOnix to save outfits and try them on virtually</p>
      </div>

      <form class="auth-form" id="signupForm">
        <div class="form-group">
          <label class="form-label" for="signupName">Full Name</label>
          <input type="text" id="signupName" class="form-input" placeholder="Your name" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="signupEmail">Email</label>
          <input type="email" id="signupEmail" class="form-input" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="signupPassword">Password</label>
          <input type="password" id="signupPassword" class="form-input" placeholder="Min. 6 characters" required minlength="6" />
        </div>
        <div class="form-group">
          <label class="form-label" for="signupGender">Gender (for recommendations)</label>
          <select id="signupGender" class="form-input">
            <option value="unisex">Prefer not to say</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
        <div class="form-error" id="signupError"></div>
        <button type="submit" class="btn btn-primary btn-lg" id="signupSubmit" style="width:100%;">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/pages/login.html">Log in</a>
      </div>
    </div>
  </div>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
