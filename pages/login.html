<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — TryOnix</title>
  <meta name="description" content="Log in to your TryOnix account to access saved outfits and virtual try-on." />
  <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  <link rel="stylesheet" href="/css/animations.css" />
</head>
<body>
  <div class="bg-mesh"></div>
  <div class="toast-container" id="toastContainer"></div>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="nav-logo" style="display:inline-block; margin-bottom: var(--space-lg);">TryOnix</a>
        <h2>Welcome Back</h2>
        <p>Log in to access your saved outfits and avatar</p>
      </div>

      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required minlength="6" />
        </div>
        <div class="form-error" id="loginError"></div>
        <button type="submit" class="btn btn-primary btn-lg" id="loginSubmit" style="width:100%;">Log In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/pages/signup.html">Sign up</a>
      </div>
    </div>
  </div>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
